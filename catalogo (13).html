<style>
  :root{
    --bg:#0D0D0E;
    --card:#18181B;
    --border:#27272A;
    --border-hover:#3a3a3f;
    --red:#E10600;
    --white:#FFFFFF;
    --silver:#A1A1AA;
    --radius:9px;
    --font-display:'Chakra Petch', -apple-system, sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  /* ---------- Header ---------- */
  .site-header{ background:var(--bg); border-bottom:1px solid var(--border); }
  .header-inner{
    max-width:1280px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .logo-wrap{
  height:48px; width:auto; max-width:190px; flex:0 0 auto; border-radius:8px;
  overflow:hidden; background:transparent; padding:0;
  display:flex; align-items:center; justify-content:center;
  }
  .logo-wrap img{ width:100%; height:100%; object-fit:contain; }
  .store-title{
    margin:0; font-family:var(--font-display); font-weight:700; font-style:italic;
    text-transform:uppercase; letter-spacing:0.02em; font-size:18px; color:var(--white);
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .toolbar-inner{
    max-width:1280px; margin:0 auto; padding:14px 24px;
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  }
  #searchInput{
    flex:1 1 240px; min-width:0; padding:10px 14px;
    border:1px solid var(--border); border-radius:7px;
    background:var(--card); font-family:var(--font-body); font-size:14px; color:var(--white);
  }
  #searchInput::placeholder{ color:var(--silver); }
  #scaleSelect, #brandSelect, #sortSelect{
    flex:0 0 auto; padding:10px 12px;
    border:1px solid var(--border); border-radius:7px;
    background:var(--card); font-family:var(--font-body); font-size:13.5px; color:var(--white);
  }
  #searchInput:focus, #scaleSelect:focus, #brandSelect:focus, #sortSelect:focus{
    outline:2px solid var(--red); outline-offset:1px; border-color:var(--red);
  }
  .counter{
    flex:0 0 auto; margin-left:auto; font-size:12.5px;
    color:var(--silver); font-variant-numeric:tabular-nums; white-space:nowrap;
  }

  /* ---------- Grid ---------- */
  main{ max-width:1280px; margin:0 auto; padding:22px 24px 60px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:16px;
  }
  .card{
    display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:var(--border-hover); transform:translateY(-2px); }
  .card-clickzone{
    display:flex; flex-direction:column; flex:1;
    color:inherit; text-decoration:none; cursor:pointer;
  }
  .card-img{
    aspect-ratio:1/1;
    background:repeating-linear-gradient(45deg, #1c1c1f 0 12px, #1a1a1d 12px 24px);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card-img img{ width:100%; height:100%; object-fit:cover; }
  .card-img .no-img{ font-size:11.5px; color:var(--silver); font-family:var(--font-body); }
  .card-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    padding:3px 8px; font-family:var(--font-display); font-style:italic;
  }
  /* Escala: la "palabra clave" del producto (ej. 1/18) -> único uso decorativo
     del rojo permitido por la guía, siguiendo su propio ejemplo. */
  .badge-escala{ background:var(--red); color:var(--white); border-radius:20px; }
  /* Marca: metadata secundaria, NO lleva rojo (regla: el rojo es exclusivo). */
  .badge-marca{ background:transparent; color:var(--silver); border:1px solid var(--border); border-radius:4px; }
  .card-title{
    margin:2px 0 0; font-family:var(--font-body); font-size:13.5px; font-weight:600;
    line-height:1.35; color:var(--white);
  }
  .card-sku{ font-size:11px; color:var(--silver); font-family:var(--font-body); }
  .card-footer{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding:8px 14px 14px; gap:8px; }
  .card-price{ font-family:var(--font-display); font-weight:700; font-style:italic; font-size:16px; color:var(--white); }
  .btn-whatsapp{
    display:inline-flex; align-items:center; gap:5px;
    background:#25D366; color:#fff; font-family:var(--font-body); font-size:12px; font-weight:700;
    padding:6px 10px; border-radius:20px; text-decoration:none; white-space:nowrap;
    border:none; cursor:pointer; transition:filter .15s ease;
  }
  .btn-whatsapp:hover{ filter:brightness(0.95); }
  .btn-whatsapp svg{ width:14px; height:14px; flex:0 0 auto; }

  /* ---------- Footer de contacto ---------- */
  .site-footer{
    margin-top:40px; padding:28px 24px 32px; text-align:center;
    background:var(--card); color:var(--white); border-top:1px solid var(--border);
  }
  .site-footer p{ margin:4px 0; font-size:13px; color:var(--silver); font-family:var(--font-body); }
  .site-footer p strong{
    color:var(--white); font-family:var(--font-display); font-style:italic;
    text-transform:uppercase; letter-spacing:0.02em;
  }
  .site-footer .footer-whatsapp{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    color:#fff; background:#25D366; padding:8px 16px; border-radius:20px;
    text-decoration:none; font-weight:700; font-size:13px; font-family:var(--font-body);
  }
  .site-footer .footer-whatsapp svg{ width:15px; height:15px; }

  /* ---------- Estado vacío ---------- */
  .empty-state{ text-align:center; color:var(--silver); padding:60px 20px; font-size:14px; font-family:var(--font-body); }

  /* ---------- Paginación ---------- */
  .pager{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-top:28px; padding-top:20px; border-top:1px solid var(--border);
  }
  .pager-btn{
    padding:8px 16px; border-radius:6px; border:1px solid var(--red);
    background:var(--bg); color:var(--white); font-family:var(--font-body);
    font-size:13px; font-weight:600; cursor:pointer; transition:background .15s ease;
  }
  .pager-btn:hover:not(:disabled){ background:rgba(225,6,0,0.12); }
  .pager-btn:disabled{ opacity:0.35; cursor:not-allowed; border-color:var(--border); }
  .pager-info{ font-size:13px; color:var(--silver); white-space:nowrap; font-family:var(--font-body); }

  @media (prefers-reduced-motion: reduce){ .card{ transition:none; } }

  @media (max-width: 520px){
    .header-inner{ padding:14px 16px; }
    .toolbar-inner{ padding:12px 16px; }
    main{ padding:16px 16px 40px; }
    .counter{ width:100%; margin-left:0; order:3; }
    .grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .card-body{ padding:8px 10px 10px; gap:4px; }
    .card-title{ font-size:12px; }
    .card-price{ font-size:14px; }
    .card-footer{ padding:6px 10px 10px; }
    .btn-whatsapp{ padding:7px; border-radius:50%; }
    .btn-whatsapp-label{ display:none; }
    .btn-whatsapp svg{ width:15px; height:15px; }
  }
</style>
</head>
<body>

  <header class="site-header">

      b.className = 'badge badge-escala';
      b.textContent = p.Escala;
      badges.appendChild(b);
    }
    const marcaTexto = p.Trademark || p.Marca;
    if(marcaTexto){
      const b = document.createElement('span');
      b.className = 'badge badge-marca';
      b.textContent = marcaTexto;
      badges.appendChild(b);
    }

    const titulo = document.createElement('p');
    titulo.className = 'card-title';
    titulo.textContent = p.Nombre || 'Sin nombre';

    const sku = document.createElement('p');
    sku.className = 'card-sku';
    sku.textContent = '';

    clickWrap.appendChild(imgWrap);
    body.appendChild(badges);
    body.appendChild(titulo);
    if(sku.textContent) body.appendChild(sku);
    clickWrap.appendChild(body);
    el.appendChild(clickWrap);

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const precio = document.createElement('span');
    precio.className = 'card-price';
    precio.textContent = p.Precio ? `S/ ${String(p.Precio).replace('.', ',')}` : '';
    footer.appendChild(precio);

    const mensaje = `Hola, quisiera cotizar este producto: ${p.Nombre || ''}`;
    const waLink = document.createElement('a');
    waLink.className = 'btn-whatsapp';
    waLink.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensaje)}`;
    waLink.target = '_blank';
    waLink.rel = 'noopener noreferrer';
    waLink.setAttribute('aria-label', 'Cotizar por WhatsApp');
    waLink.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"></path><path d="M12.041 21.785h-.004a9.706 9.706 0 01-4.949-1.354l-.355-.21-3.68.967.982-3.588-.231-.367a9.72 9.72 0 01-1.487-5.171c.002-5.363 4.365-9.727 9.729-9.727 2.598 0 5.041 1.014 6.878 2.853 1.836 1.84 2.847 4.283 2.846 6.883-.002 5.362-4.365 9.716-9.729 9.716zm8.234-17.966A11.647 11.647 0 0012.041.9C5.505.9.184 6.219.182 12.756a11.783 11.783 0 001.585 5.902L0 24l5.474-1.612a11.79 11.79 0 005.567 1.418h.005c6.535 0 11.856-5.32 11.858-11.857a11.86 11.86 0 00-3.629-8.13z"></path></svg><span class="btn-whatsapp-label">Cotizar</span>';
    // Si la tarjeta entera es un <a> (porque hay URL_Producto), evita que el click
    // en el botón de WhatsApp también dispare la navegación de la tarjeta.
    waLink.addEventListener('click', (e) => e.stopPropagation());
    footer.appendChild(waLink);

    el.appendChild(footer);
    return el;
  }

  function coincideBusqueda(p, termino){
    if(!termino) return true;
    const palabras = termino.split(/\s+/).filter(Boolean);
    const textoCompleto = [p.Nombre, p.Marca, p.Trademark, p.SKU]
      .map(campo => normalizar(campo))
      .join(' ');
    // Cada palabra debe aparecer en algún lugar del texto combinado (AND),
    // así "f1 burago" encuentra productos que tengan ambas palabras aunque
    // estén en campos distintos o en cualquier orden.
    return palabras.every(palabra => textoCompleto.includes(palabra));
  }

  function numeroPrecio(precio){
    let s = String(precio == null ? '' : precio).trim();
    if(!s) return -Infinity;

    // Deja solo dígitos, puntos, comas y signo negativo (quita "S/", espacios, etc.)
    s = s.replace(/[^\d.,-]/g, '');
    if(!s) return -Infinity;

    const ultimaComa = s.lastIndexOf(',');
    const ultimoPunto = s.lastIndexOf('.');

    if(ultimaComa > -1 && ultimoPunto > -1){
      // Vienen ambos separadores: el que aparece último es el decimal,
      // el otro es separador de miles y se elimina.
      if(ultimaComa > ultimoPunto){
        s = s.replace(/\./g, '').replace(',', '.');
      } else {
        s = s.replace(/,/g, '');
      }
    } else if(ultimaComa > -1){
      // Solo coma: si tiene exactamente 3 dígitos después, es separador de
      // miles (ej. "2,235" -> 2235); si no, es el decimal (ej. "12,5" -> 12.5).
      const digitosDespues = s.length - ultimaComa - 1;
      s = digitosDespues === 3 ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if(ultimoPunto > -1){
      // Solo punto: mismo criterio (ej. "2.235" -> 2235, "12.50" -> 12.50)
      const digitosDespues = s.length - ultimoPunto - 1;
      if(digitosDespues === 3) s = s.replace(/\./g, '');
    }

    const n = parseFloat(s);
    return isNaN(n) ? -Infinity : n;
  }

  function ordenar(lista, criterio){
    const copia = lista.slice();
    if(criterio === 'precio-asc'){
      copia.sort((a, b) => numeroPrecio(a.Precio) - numeroPrecio(b.Precio));
    } else if(criterio === 'precio-desc'){
      copia.sort((a, b) => numeroPrecio(b.Precio) - numeroPrecio(a.Precio));
    } else if(criterio === 'nombre-asc'){
      copia.sort((a, b) => normalizar(a.Nombre).localeCompare(normalizar(b.Nombre)));
    }
    return copia;
  }

  // Detecta si el producto es de la categoría F1: si alguna palabra de la
  // descripción contiene "f1" (ej. "F1", "F1-2023", "F1team").
  function esF1(p){
    const nombre = normalizar(p.Nombre || '');
    return nombre.split(/\s+/).some(palabra => palabra.includes('f1'));
  }

  function render(){
    const termino = normalizar(searchInput.value.trim());
    const escala = scaleSelect.value;
    const marca = brandSelect.value;

    let filtrados = PRODUCTOS.filter(p =>
      coincideBusqueda(p, termino) &&
      (!escala || (p.Escala || '') === escala) &&
      (!marca || (marca === 'F1' ? esF1(p) : marcaReal(p) === marca))
    );
    filtrados = ordenar(filtrados, sortSelect.value);

    const totalPaginas = Math.max(1, Math.ceil(filtrados.length / PRODUCTOS_POR_PAGINA));
    if(paginaActual > totalPaginas) paginaActual = totalPaginas;
    if(paginaActual < 1) paginaActual = 1;

    const inicio = (paginaActual - 1) * PRODUCTOS_POR_PAGINA;
    const pagina = filtrados.slice(inicio, inicio + PRODUCTOS_POR_PAGINA);

    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    pagina.forEach(p => frag.appendChild(crearTarjeta(p)));
    grid.appendChild(frag);

    emptyState.hidden = filtrados.length !== 0;
    emptyState.textContent = cargando
      ? 'Cargando catálogo...'
      : 'No se encontraron productos con esos filtros.';
    counter.textContent = cargando
      ? 'Cargando...'
      : (filtrados.length === 1 ? '1 producto' : `${filtrados.length} productos`);

    pager.hidden = filtrados.length <= PRODUCTOS_POR_PAGINA;
    pagerPrev.disabled = paginaActual <= 1;
    pagerNext.disabled = paginaActual >= totalPaginas;
    pagerInfo.textContent = `Página ${paginaActual} de ${totalPaginas}`;
  }

  function irAPagina(n){
    paginaActual = n;
    render();
    window.scrollTo({ top: main.offsetTop - 20, behavior: 'auto' });
  }

  // Evita re-renderizar en cada tecla; espera una pausa breve mientras se escribe
  let debounceTimer = null;
  function renderConDebounce(){
    paginaActual = 1;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 200);
  }

  function parseCSV(texto){
    const filas = [];
    let fila = [], campo = '', dentroComillas = false;
    for(let i = 0; i < texto.length; i++){
      const c = texto[i];
      if(dentroComillas){
        if(c === '"'){
          if(texto[i+1] === '"'){ campo += '"'; i++; }
          else dentroComillas = false;
        } else {
          campo += c;
        }
      } else if(c === '"'){
        dentroComillas = true;
      } else if(c === ','){
        fila.push(campo); campo = '';
      } else if(c === '\n' || c === '\r'){
        if(c === '\r' && texto[i+1] === '\n') i++;
        fila.push(campo); campo = '';
        filas.push(fila);
        fila = [];
      } else {
        campo += c;
      }
    }
    if(campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
    return filas.filter(f => f.some(v => v !== ''));
  }

  function csvAProductos(texto){
    const filas = parseCSV(texto);
    if(filas.length < 2) return [];
    const encabezados = filas[0].map(h => h.trim().toLowerCase());
    const indice = {};
    ['sku', 'marca', 'escala', 'nombre', 'trademark', 'precio', 'imagen_url', 'foto', 'url_producto'].forEach(campo => {
      indice[campo] = encabezados.indexOf(campo);
    });
    // Alias: si la hoja usa "Foto" en vez de "Imagen_URL" para la imagen, igual funciona
    if(indice.imagen_url < 0 && indice.foto >= 0){
      indice.imagen_url = indice.foto;
    }
    const obtener = (fila, campo) => (indice[campo] >= 0 ? (fila[indice[campo]] || '').trim() : '');

    return filas.slice(1)
      .map(fila => ({
        SKU: obtener(fila, 'sku'),
        Marca: obtener(fila, 'marca'),
        Escala: obtener(fila, 'escala'),
        Nombre: obtener(fila, 'nombre'),
        Trademark: obtener(fila, 'trademark'),
        Precio: obtener(fila, 'precio'),
        Imagen_URL: obtener(fila, 'imagen_url'),
        URL_Producto: obtener(fila, 'url_producto'),
      }))
      .filter(p => p.Nombre);
  }

  async function cargarDesdeSheet(){
    if(!SHEET_CSV_URL){
      cargando = false;
      render();
      return;
    }
    try{
      const resp = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const texto = await resp.text();
      const nuevos = csvAProductos(texto);
      if(nuevos.length){
        PRODUCTOS = nuevos;
        poblarEscalas();
        poblarMarcas();
        paginaActual = 1;
      }
    } catch(e){
      console.error('No se pudo actualizar desde Google Sheets:', e);
    } finally {
      cargando = false;
      render();
    }
  }

  poblarEscalas();
  poblarMarcas();
  searchInput.addEventListener('input', renderConDebounce);
  scaleSelect.addEventListener('change', () => { paginaActual = 1; render(); });
  brandSelect.addEventListener('change', () => { paginaActual = 1; render(); });
  sortSelect.addEventListener('change', () => { paginaActual = 1; render(); });
  pagerPrev.addEventListener('click', () => irAPagina(paginaActual - 1));
  pagerNext.addEventListener('click', () => irAPagina(paginaActual + 1));
  render();
  cargarDesdeSheet();
</script>
